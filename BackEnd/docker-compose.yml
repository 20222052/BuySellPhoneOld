version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: buysellphoneold
    ports:
      - "6379:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: kafka_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    restart: always
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kafka_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: pgvector/pgvector:pg17
    container_name: docker_postgres_pgvector
    ports:
      - "5433:5432"     # port datasource
    environment:
      POSTGRES_USER: tungnt         # thay bằng user bạn muốn
      POSTGRES_PASSWORD: tungnt # thay bằng password bạn muốn
      POSTGRES_DB: buysellphoneold             # optional: setting default DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
